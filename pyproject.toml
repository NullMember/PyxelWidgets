[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxelwidgets"
dynamic = ["version"]
description = "Grid controller interfaces (Launchpad, APC, Push...) for music: a visual designer, a player and a Python framework"
keywords = ["midi", "launchpad", "grid", "controller", "sequencer", "designer", "music", "mackie", "osc", "bluetooth-midi"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Malik Enes Şafak", email = "e.maliksafak@gmail.com" }]
requires-python = ">= 3.10"
dependencies = [
    "numpy >= 1.23",
    "python-rtmidi >= 1.5",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.optional-dependencies]
osc = ["python-osc >= 1.8"]
network = ["zeroconf >= 0.100"]
bluetooth = ["dbus-fast >= 2.0; platform_system == 'Linux'", "bleak >= 0.22"]
desktop = ["pynput >= 1.7"]
app = ["pywebview >= 5.0"]
test = ["pytest >= 7"]

[project.scripts]
pyxelwidgets = "pyxelwidgets.__main__:main"
pyxelwidgets-designer = "pyxelwidgets.designer.__main__:main"

[project.urls]
Homepage = "https://github.com/NullMember/PyxelWidgets"
Issues = "https://github.com/NullMember/PyxelWidgets/issues"

[tool.setuptools.dynamic]
version = { attr = "pyxelwidgets.__version__" }

[tool.setuptools.package-data]
"pyxelwidgets.designer" = ["static/*", "templates/*.json", "snippets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
