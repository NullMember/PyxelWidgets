# Builds everything a release has: the Python package, the desktop apps
# (macOS, Windows, Linux) and the Android app. On a version tag (v1.2.3, the
# same as pyxelwidgets.__version__) it also publishes them: the package to
# PyPI, the rest to a GitHub release. Run by hand (Actions > Release > Run
# workflow) it only builds, and the files are kept as the run's artifacts.
#
# Secrets (Settings > Secrets and variables > Actions); without them the apps
# are still built, signed ad hoc (macOS) or with the debug key (Android):
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD  that .p12's password
#   MACOS_SIGN_IDENTITY         the certificate's name, e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_KEY            base64 of an App Store Connect API key (.p8) for notarization
#   MACOS_NOTARY_KEY_ID         its key ID
#   MACOS_NOTARY_ISSUER         its issuer ID
#   ANDROID_KEYSTORE            base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# PyPI uses trusted publishing: no token, but pypi.org must list this
# repository's release.yml (environment "pypi") as a publisher.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('src/pyxelwidgets/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but the package is $version"; exit 1; }
          python packaging/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: ALSA (python-rtmidi builds from source on Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: The wheel works
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/pyxelwidgets --help
          /tmp/check/bin/python -c "import pyxelwidgets.designer as d; assert d.templates() and d.snippets()"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  desktop:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Step conditions can't read secrets
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pywebview's Windows backend (pythonnet) lags behind the newest Python
          python-version: "3.13"
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        # A display while building: pynput (keyboard and mouse output) only imports with one
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev xvfb
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "PYXELWIDGETS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_KEY" ]; then
            echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "PYXELWIDGETS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "PYXELWIDGETS_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "PYXELWIDGETS_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER" >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: Build
        if: runner.os != 'Linux'
        run: python packaging/build.py
      - name: The Windows app opens its window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath "$env:RUNNER_TEMP\unpacked"
          $env:PYXELWIDGETS_REMOTE_DEBUGGING = '9222'
          $app = Start-Process "$env:RUNNER_TEMP\unpacked\PyxelWidgets\PyxelWidgets.exe" -ArgumentList '--offline' -PassThru
          $shown = $false
          foreach ($i in 1..60) {
            Start-Sleep 1
            try { if ((Invoke-WebRequest http://127.0.0.1:9222/json -UseBasicParsing).Content -match '"title": "PyxelWidgets') { $shown = $true; break } } catch {}
            if ($app.HasExited) { break }
          }
          if (-not $app.HasExited) { Stop-Process $app -Force }
          if ($shown) { "The designer page is shown" } else {
            "The window didn't show the designer (exit code $($app.ExitCode))"
            Get-Content "$env:APPDATA\PyxelWidgets\PyxelWidgets.log" -ErrorAction SilentlyContinue
            exit 1
          }
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py
      - name: The Linux app opens its window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0 libegl1
          mkdir "$RUNNER_TEMP/unpacked" && tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/PyxelWidgets"
          QTWEBENGINE_REMOTE_DEBUGGING=9222 QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox xvfb-run -a ./PyxelWidgets --offline > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:9222/json | grep -q '"title": "PyxelWidgets' && break; sleep 1; done
          curl -s http://127.0.0.1:9222/json | grep -q '"title": "PyxelWidgets' && echo "The designer page is shown" || { echo "The window didn't show the designer"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          pkill -f "unpacked/PyxelWidgets/PyxelWidgets" || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  android:
    name: App (Android)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        id: python
        with:
          # Chaquopy builds with the Python the app runs (numpy's Android wheels stop at 3.13)
          python-version: "3.13"
      - name: Release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "PYXELWIDGETS_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "PYXELWIDGETS_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "PYXELWIDGETS_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "PYXELWIDGETS_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PbuildPython="${{ steps.python.outputs.python-path }}"
      - name: Name it
        run: |
          version=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('src/pyxelwidgets/__init__.py').read()).group(1))")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/PyxelWidgets-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-Android
          path: dist/*.apk

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop, android]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 packaging/release_notes.py "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "PyxelWidgets ${GITHUB_REF_NAME#v}" --notes-file "$notes"
