<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyxelWidgets Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">PyxelWidgets <span>Designer</span></div>
    <div class="file" id="file" title="Layout file"></div>
    <div class="tools">
      <button id="toggle-left" class="icon" title="Show or hide the left panel ([)" aria-label="Left panel">⟨</button>
      <button id="toggle-right" class="icon" title="Show or hide the right panel (])" aria-label="Right panel">⟩</button>
      <span class="divider"></span>
      <div class="segmented" role="group" aria-label="Mode">
        <button id="mode-edit" class="active" title="Place and configure widgets (E)">Edit</button>
        <button id="mode-try" title="Press pads to try the widgets (T)">Try</button>
      </div>
      <button id="play" title="Play the transport so Sequencers and Trackers play (Space)">▶ Play</button>
      <span id="position" class="position" aria-live="off"></span>
      <span class="divider"></span>
      <div class="segmented zoom" role="group" aria-label="Zoom">
        <button id="zoom-out" title="Zoom out (Ctrl/Cmd -)">−</button>
        <button id="zoom-fit" title="Fit the grid in the window (Ctrl/Cmd 0)">Fit</button>
        <button id="zoom-in" title="Zoom in (Ctrl/Cmd +, or Ctrl/Cmd + scroll)">+</button>
      </div>
      <span class="divider"></span>
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <span class="divider"></span>
      <button id="problems" class="problems" title="Problems in the layout" hidden></button>
      <button id="help" class="icon" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <div class="menu-wrap">
        <button id="file-menu" title="New, open, save as, download" aria-haspopup="true">File ▾</button>
        <div class="menu" id="file-list" role="menu" hidden></div>
      </div>
      <input type="file" id="open-file" accept=".json,application/json" hidden>
      <button id="save" class="primary" title="Save to the layout file (Ctrl+S)">Save</button>
    </div>
  </header>
  <main>
    <aside class="panel" id="left">
      <section class="fold" data-fold="widgets">
        <h2 class="fold-head">Widgets <span class="fold-note" id="palette-hint"></span></h2>
        <div class="fold-body">
          <div id="palette" class="palette"></div>
        </div>
      </section>
      <section class="fold" data-fold="devices">
        <h2 class="fold-head">Devices <span class="count" id="device-count"></span></h2>
        <div class="fold-body">
          <div class="row">
            <select id="device-type" aria-label="Device type"></select>
            <button id="add-device">Add</button>
            <button id="detect-devices" title="Find the devices plugged in">Detect</button>
          </div>
          <ul id="devices" class="list"></ul>
        </div>
      </section>
      <section class="fold" data-fold="outputs">
        <h2 class="fold-head">Outputs <span class="count" id="output-count"></span></h2>
        <div class="fold-body">
          <div class="row">
            <select id="output-type" aria-label="Output type"></select>
            <button id="add-output">Add</button>
          </div>
          <ul id="outputs" class="list"></ul>
        </div>
      </section>
      <section class="grow layers">
        <h2>Layers</h2>
        <input type="search" id="layer-search" placeholder="Find a widget" aria-label="Find a widget">
        <ul id="tree" class="tree"></ul>
      </section>
      <div class="splitter" id="split-left" title="Drag to resize"></div>
    </aside>
    <section id="center">
      <section id="stage">
        <div id="board">
          <div id="pads"></div>
          <div id="overlay"></div>
        </div>
        <div id="status" role="status"></div>
      </section>
      <section id="drawer">
        <div class="drawer-bar">
          <div class="tabs" role="tablist">
            <button data-tab="events" role="tab">Events</button>
            <button data-tab="connections" role="tab">Connections</button>
            <button data-tab="python" role="tab">Python</button>
            <button data-tab="problems" role="tab">Problems</button>
          </div>
          <div class="drawer-tools" id="drawer-tools"></div>
          <button id="drawer-toggle" class="icon" title="Show or hide (`)" aria-label="Drawer">▾</button>
        </div>
        <div class="drawer-body">
          <ol id="events" class="events" data-panel="events"></ol>
          <div id="connections" data-panel="connections"></div>
          <pre id="code" data-panel="python"></pre>
          <ul id="problem-list" class="problem-list" data-panel="problems"></ul>
        </div>
      </section>
    </section>
    <aside class="panel" id="right">
      <div class="splitter" id="split-right" title="Drag to resize"></div>
      <section id="properties"></section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
